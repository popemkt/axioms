[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/agent", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
axioms-core = { path = "crates/core" }
axioms-store = { path = "crates/store" }
axioms-agent = { path = "crates/agent" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
petgraph = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "fs"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
